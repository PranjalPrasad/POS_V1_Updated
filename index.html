<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kunash POS - Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange-1:#FBEAEE;
    --orange-2:#C15D7D;
    --orange-3:#A53860;
    --orange-4:#8B2635;
    --orange-5:#6B1D29;
    --ink:#2B1B14;
    --ink-soft:#6B5A4E;
    --paper:#FFF7F9;
    --card:#FFFFFF;
    --line:#F0E3D8;
    --error:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    overflow-x:hidden;
  }
  /* very subtle plain-background texture: two soft radial washes, nothing busy */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(560px 420px at 12% 8%, var(--orange-1) 0%, transparent 70%),
      radial-gradient(620px 480px at 92% 96%, #FCE9EE 0%, transparent 65%);
    pointer-events:none;
    z-index:0;
  }
  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:406px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px 36px 32px;
    box-shadow:0 1px 2px rgba(43,27,20,0.04), 0 24px 48px -20px rgba(139,38,53,0.22);
  }
  .brand{
    text-align:center;
    margin-bottom:30px;
  }
  .logo-badge{
    width:76px;
    height:76px;
    margin:0 auto 18px;
    border-radius:22px;
    background:linear-gradient(160deg, var(--orange-1) 0%, #ffffff 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 24px -10px rgba(139,38,53,0.45), inset 0 0 0 1px rgba(139,38,53,0.08);
  }
  .logo-badge img{
    width:52px;
    height:52px;
    object-fit:contain;
    display:block;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0 0 6px;
    color:var(--ink);
  }
  .subtitle{
    margin:0;
    font-size:14px;
    color:var(--ink-soft);
  }
  .field{
    margin-bottom:20px;
  }
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .input-row{
    position:relative;
  }
  .input-row .prefix{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    font-size:15px;
    color:var(--ink-soft);
    font-weight:500;
    pointer-events:none;
  }
  input#mobileNumber{
    width:100%;
    padding:14px 16px 14px 46px;
    font-size:16px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:#FFFDFB;
    border:1.5px solid var(--line);
    border-radius:12px;
    outline:none;
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  input#mobileNumber::placeholder{color:#C9B8AC;}
  input#mobileNumber:focus{
    border-color:var(--orange-3);
    background:#fff;
    box-shadow:0 0 0 4px rgba(165,56,96,0.14);
  }
  input#mobileNumber.shake{animation:shake .45s ease-in-out;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  #errorMessage{
    margin-top:8px;
    font-size:13px;
    color:var(--error);
    display:none;
  }
  #errorMessage.fade-in{
    display:block;
    animation:fadeIn .25s ease-in-out;
  }
  @keyframes fadeIn{from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);}}

  button#loginBtn{
    width:100%;
    padding:14px;
    font-size:15.5px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    color:#fff;
    background:linear-gradient(135deg, var(--orange-3) 0%, var(--orange-5) 100%);
    border:none;
    border-radius:12px;
    cursor:pointer;
    box-shadow:0 10px 22px -8px rgba(107,29,41,0.55);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  button#loginBtn:hover{
    transform:translateY(-1px);
    box-shadow:0 14px 26px -8px rgba(107,29,41,0.6);
  }
  button#loginBtn:active{transform:translateY(0);}
  button#loginBtn.opacity-75{opacity:.75; cursor:not-allowed;}
  button#loginBtn:focus-visible{
    outline:2px solid var(--orange-5);
    outline-offset:3px;
  }

  .hidden{display:none !important;}

  #loginSpinner svg{
    animation:spin 0.8s linear infinite;
    vertical-align:-3px;
    margin-right:8px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .demo-note{
    margin-top:22px;
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    padding-top:16px;
    border-top:1px solid var(--line);
  }

  /* Success state */
  #successMessage{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:44px 32px;
    text-align:center;
    box-shadow:0 1px 2px rgba(43,27,20,0.04), 0 24px 48px -20px rgba(139,38,53,0.22);
  }
  .success-badge{
    width:64px;height:64px;margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--orange-2), var(--orange-4));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 24px -10px rgba(139,38,53,0.5);
  }
  #successMessage h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:22px;
    margin:0 0 6px;
    color:var(--ink);
  }
  #successMessage p{
    margin:0 0 18px;
    font-size:14px;
    color:var(--ink-soft);
  }
  .success-spinner{
    width:28px;height:28px;margin:0 auto;
    border:3px solid var(--orange-1);
    border-top-color:var(--orange-4);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }

  footer.copyright{
    position:relative;
    z-index:1;
    text-align:center;
    margin-top:26px;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.01em;
  }
  footer.copyright span{color:var(--orange-4); font-weight:600;}

  @media (prefers-reduced-motion: reduce){
    .shake, .fade-in, #loginSpinner svg, .success-spinner, button#loginBtn{animation:none !important; transition:none !important;}
  }
</style>
</head>

    if (isLoggedIn === 'true') {
      window.location.href = 'pos-sheets-integration.html';
    }

    mobileInput.addEventListener('input', function(e){
      let value = e.target.value.replace(/\D/g, '');
      e.target.value = value;
      if (errorMessage.classList.contains('fade-in')) {
        errorMessage.classList.add('hidden');
        errorMessage.classList.remove('fade-in');
        mobileInput.classList.remove('shake');
      }
    });

    loginForm.addEventListener('submit', function(e){
      e.preventDefault();
      const mobileNumber = mobileInput.value.trim();

      if (!mobileNumber) {
        showError('Please enter mobile number');
        return;
      }
      if (mobileNumber.length !== 10) {
        showError('Mobile number must be 10 digits');
        return;
      }

      showLoading(true);

      setTimeout(() => {
        if (mobileNumber.length === 10) {
          sessionStorage.setItem('isLoggedIn', 'true');
          sessionStorage.setItem('mobileNumber', mobileNumber);
          showSuccess();
          setTimeout(() => {
            window.location.href = 'pos-sheets-integration.html';
          }, 1500);
        } else {
          showError('Invalid mobile number');
          showLoading(false);
        }
      }, 1000);
    });

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
      errorMessage.classList.add('fade-in');
      mobileInput.classList.add('shake');
      setTimeout(() => { mobileInput.classList.remove('shake'); }, 500);
    }

    function showLoading(show) {
      if (show) {
        loginBtnText.classList.add('hidden');
        loginSpinner.classList.remove('hidden');
        loginBtn.disabled = true;
        loginBtn.classList.add('opacity-75');
      } else {
        loginBtnText.classList.remove('hidden');
        loginSpinner.classList.add('hidden');
        loginBtn.disabled = false;
        loginBtn.classList.remove('opacity-75');
      }
    }

    function showSuccess() {
      document.getElementById('loginForm').classList.add('hidden');
      successMessage.classList.remove('hidden');
    }
  </script>
</body>
</html>
